#
# llama-server model presets (router mode)
# ========================================
#
# Referenced by --models-preset in /usr/lib/systemd/system/llama-server.service.
# This file MUST
# exist for the server to start; it is safe to leave it as-is.
#
# Models are discovered from --models-dir (/var/lib/llama-cpu/models): each
# .gguf file becomes a model whose id is the file name without the .gguf
# extension. Requests pick a model through the "model" field:
#
#   curl ... -d '{"model": "Qwen3-8B-Q8_0", "messages": [...]}'
#
# Sections below override the command-line defaults per model. Keys are CLI
# arguments without the leading dashes, e.g. --ctx-size 8192 becomes
# "ctx-size = 8192". A section that does not match a discovered model needs
# its own "model = PATH" key. See /usr/share/doc/llama-cpu/README.md.
#

[*]
; Global defaults applied to every model. Command-line arguments win over
; these values.
;
; Quantize the KV cache to 8-bit: cuts KV memory ~2x vs the default f16, so
; you fit longer contexts / more concurrent requests in the same RAM. Quality
; impact is negligible for q8_0.
; NOTE: a quantized V cache REQUIRES flash attention (see llama-context.cpp:
; a quantized V cache forces flash_attn on). We enable flash-attn explicitly
; so the requirement is always satisfied and the server never refuses to start.
cache-type-k  = q8_0
cache-type-v  = q8_0
flash-attn    = true
;
; ctx-size      = 8192
; threads       = 16
; threads-batch = 16

; Per-model sections use the model id (file name minus .gguf):
; [Qwen3-8B-Q8_0]
; ctx-size        = 16384
; load-on-startup = true

; [LFM2.5-8B-A1B-Q8_0]
; ctx-size        = 32768
; load-on-startup = true
